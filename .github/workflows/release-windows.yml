name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install Frontend Dependencies
        run: |
          cd windows
          npm install

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          RAW_VER="${TAG#v}"
          echo "version=$RAW_VER" >> $GITHUB_OUTPUT

      - name: Sync Version from Tag
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          echo "Syncing version to $VERSION"
          node -e "
            const fs = require('fs');
            const pkgPath = './windows/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            const tauriPath = './windows/src-tauri/tauri.conf.json';
            const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            tauri.version = '$VERSION';
            fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

            const cargoPath = './windows/src-tauri/Cargo.toml';
            let cargo = fs.readFileSync(cargoPath, 'utf8');
            cargo = cargo.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"' + '$VERSION' + '\"');
            fs.writeFileSync(cargoPath, cargo);
          "

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./windows
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: 'Looma ${{ steps.vars.outputs.tag }}'
          releaseDraft: false
          prerelease: false
